name: WP01 isolated reproducibility gate

on:
  workflow_dispatch:
  push:
    branches: [hum-282-wp01a-reproducible-pin]
    paths:
      - ".github/workflows/wp01-isolated-gate.yml"
      - "experiments/wp00/**"
      - "docs/wp01-sdk-shared-pin.md"

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Build pinned runner image
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/wp01-evidence"
          install -d -m 0777 "$evidence"
          set +e
          docker build --progress=plain --pull=false --tag wp01-runner:${GITHUB_SHA} \
            --file experiments/wp00/ci/Dockerfile . 2>&1 | tee "$evidence/image-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            detail=$(tail -n 8 "$evidence/image-build.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            printf '%s\n' "::error title=Pinned runner image build failed::${detail}"
            exit "$build_status"
          fi

      - name: Build fresh source and verified artifacts
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/wp01-build"
          evidence="${RUNNER_TEMP}/wp01-evidence"
          install -d -m 0777 "$work"
          set +e
          docker run --rm --user 999:999 \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --mount "type=bind,src=${work},dst=/work" \
            wp01-runner:${GITHUB_SHA} \
            /bin/bash /repo/experiments/wp00/ci/setup.sh /repo /work 2>&1 | tee "$evidence/setup.log"
          setup_status=${PIPESTATUS[0]}
          set -e
          if [ "$setup_status" -ne 0 ]; then
            detail=$(tail -n 8 "$evidence/setup.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            printf '%s\n' "::error title=Fresh source setup failed::${detail}"
            exit "$setup_status"
          fi

      - name: Run complete matrix without network
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/wp01-build"
          scratch="${RUNNER_TEMP}/wp01-scratch"
          evidence="${RUNNER_TEMP}/wp01-evidence"
          install -d -m 0777 "$scratch"
          set +e
          docker run --rm --user 999:999 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --cpus 2 --memory 3g --memory-swap 3g --pids-limit 128 \
            --ulimit cpu=150:150 --ulimit nproc=128:128 --ulimit nofile=1024:1024 --ulimit fsize=1073741824:1073741824 \
            --tmpfs /dev/shm:ro,noexec,nosuid,nodev,size=64m \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --mount "type=bind,src=${work}/source,dst=/source,readonly" \
            --mount "type=bind,src=${work}/tarballs,dst=/tarballs,readonly" \
            --mount "type=bind,src=${work}/packages,dst=/packages,readonly" \
            --mount "type=bind,src=${work}/readonly-empty,dst=/var/lib/postgresql/data,readonly" \
            --mount "type=bind,src=${scratch},dst=/scratch" \
            --entrypoint /usr/bin/env wp01-runner:${GITHUB_SHA} -i \
            PATH=/usr/lib/postgresql/17/bin:/usr/local/bin:/usr/bin:/bin \
            HOME=/scratch/home TMPDIR=/scratch LANG=C.UTF-8 \
            /usr/bin/timeout --signal=KILL 180s /bin/bash /repo/experiments/wp00/ci/run-full-gate.sh \
            2>&1 | tee "$evidence/full-gate.log"
          gate_status=${PIPESTATUS[0]}
          set -e
          if [ "$gate_status" -ne 0 ]; then
            detail=$(tail -n 8 "$evidence/full-gate.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            printf '%s\n' "::error title=Isolated full matrix failed::${detail}"
            exit "$gate_status"
          fi

      - name: Upload auditable gate log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp01-isolated-gate-${{ github.sha }}
          path: ${{ runner.temp }}/wp01-evidence/
          if-no-files-found: error
          retention-days: 14
